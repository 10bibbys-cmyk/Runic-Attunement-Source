name: Import Verified 1.3.8 Source Snapshot
on:
  push:
    paths:
      - '.github/workflows/import-verified-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recover source and resources from checksum-verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ra-recovery
          jar="/tmp/ra-recovery/Runic-Attunement-1.3.8-Fabric-1.20.1.jar"
          curl --fail --silent --show-error --location --retry 3 "https://mediafilez.forgecdn.net/files/9595/336/Runic-Attunement-1.3.8-Fabric-1.20.1.jar" -o "$jar"
          echo "0661dd74284e329389faaf20613f649d7ce06556da5bdf0d60def60e055e0f12  $jar" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 3 "https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar" -o /tmp/ra-recovery/cfr.jar
          mkdir -p src/main/java src/main/resources
          java -jar /tmp/ra-recovery/cfr.jar "$jar" --outputdir src/main/java --silent true
          rm -f src/main/java/summary.txt
          python3 - "$jar" <<'PY'
          import json,sys,zipfile
          from pathlib import Path
          root=Path('src/main/resources')
          with zipfile.ZipFile(sys.argv[1]) as z:
            for entry in z.infolist():
              if entry.is_dir() or entry.filename.endswith('.class') or entry.filename.startswith('META-INF/'): continue
              f=root/entry.filename
              f.parent.mkdir(parents=True,exist_ok=True)
              f.write_bytes(z.read(entry))
          metadata_file=root/'fabric.mod.json'
          meta=json.loads(metadata_file.read_text(encoding='utf-8'))
          assert meta['id']=='runic_attunement' and meta['version']=='1.3.8'
          assert 'pota.runicmpfix.RunicMpFix' in meta['entrypoints']['main']
          meta['license']='All-Rights-Reserved'
          metadata_file.write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Source classes:',sum(p.is_file() for p in Path('src/main/java').rglob('*.java')))
          print('Non-class resources:',sum(p.is_file() for p in root.rglob('*')))
          PY
          cat > src/main/resources/LICENSE <<'LICENSE'
          Copyright (c) 2026 Path of the Ascended
          All Rights Reserved.

          Source code and assets are publicly viewable for inspection only.
          No permission is granted to copy, modify, sublicense, or redistribute
          except where permitted by applicable law or with written permission.
          The software is provided as is, without warranties.
          LICENSE
          git config user.name "PotA Source Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main
          if git diff --cached --quiet; then
            echo "Source already imported"
            exit 0
          fi
          git commit -m "Publish checksum-verified Runic Attunement 1.3.8 recovered source"
          git push
