name: Build 1.3.8.1 Recovered Source

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and package
        run: gradle clean build --stacktrace
      - name: Verify generated JAR metadata and lifecycle helper
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          outputs = [
              file for file in glob.glob('build/libs/*.jar')
              if not file.endswith('-sources.jar') and not file.endswith('-dev.jar')
          ]
          assert outputs, 'No release JAR produced'
          matched = []
          for jar in outputs:
              with zipfile.ZipFile(jar) as z:
                  if 'fabric.mod.json' not in z.namelist():
                      continue
                  metadata = json.loads(z.read('fabric.mod.json'))
                  if metadata.get('id') != 'runic_attunement':
                      continue
                  assert metadata.get('version') == '1.3.8.1', metadata
                  assert 'dev/runicattunement/compat/RunicStoppedLifecycle.class' in z.namelist()
                  assert 'dev/runicattunement/compat/RunicCompatibility.class' in z.namelist()
                  assert z.testzip() is None
                  matched.append(jar)
          assert matched, 'Missing correctly versioned Runic 1.3.8.1 JAR'
          print('Verified recovered-source build:', *matched)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runic-attunement-1.3.8.1-recovered-source-build
          path: build/libs/*.jar
